services:
  - type: web
    name: gn-rotation-dashboard
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DASHBOARD_USER
        value: gn
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: AI_ANALYSIS_ENABLED
        value: "false"
      - key: AI_PAID_REQUESTS_ENABLED
        value: "false"
      - key: AI_MAX_COST_USD_PER_RUN
        value: "0.05"
      - key: PERPLEXITY_ENABLED
        value: "false"
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: XAI_ENABLED
        value: "false"
      - key: XAI_API_KEY
        sync: false
      - key: DEEPSEEK_ENABLED
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_ENABLED
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_ENABLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false

  - type: cron
    name: gn-multi-ai-analysis
    runtime: node
    plan: starter
    region: singapore
    autoDeployTrigger: commit
    buildCommand: npm install --omit=dev
    startCommand: npm run ai:analyze
    schedule: "*/5 * * * *"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_ANALYSIS_ENABLED
        value: "true"
      - key: AI_PAID_REQUESTS_ENABLED
        value: "true"
      - key: AI_MAX_COST_USD_PER_RUN
        value: "0.05"
      - key: PERPLEXITY_ENABLED
        value: "true"
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: XAI_ENABLED
        value: "true"
      - key: XAI_API_KEY
        sync: false
      - key: DEEPSEEK_ENABLED
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_ENABLED
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false

# Market and Pre-Pump collection are scheduled canonically in Supabase:
# - gn_market_collector_5m
# - gn_pre_pump_scanner_15m
# The scanner now stores only immediate-entry PASS rows as TOP3.
# Paid 5AI verification runs only on a new mechanically qualified snapshot and skips duplicates/no-candidate runs.
