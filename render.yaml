
services:
  - type: web
    name: gn-rotation-dashboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DASHBOARD_USER
        value: gn
      - key: DASHBOARD_PASSWORD
        generateValue: true

# Market and Pre-Pump collection are scheduled canonically in Supabase:
# - gn_market_collector_5m
# - gn_pre_pump_scanner_15m
# Keep Render focused on serving the dashboard so duplicate collectors cannot
# overwrite fresh verified snapshots with partial/stale data.
