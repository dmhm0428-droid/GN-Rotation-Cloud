name: Validate dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node --check src/start.js
      - run: node --check src/dashboard-big-picture-v1.js
      - run: node --check src/precursor-dashboard.js
      - run: node --check src/dashboard-precursor-top3-v1.js
      - run: node --check src/dashboard-resilience-patch.js
      - run: node --check src/dashboard-hard-rescue.js
      - run: node --check src/final-dashboard-patch.js
      - run: node --test test/dashboard-resilience.test.js
      - name: Verify Render build configuration
        run: |
          grep -q 'buildCommand: npm install --omit=dev' render.yaml
          grep -q 'healthCheckPath: /health' render.yaml
      - name: Boot server and verify public routes
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_URL='http://127.0.0.1:9'
          export SUPABASE_SERVICE_ROLE_KEY='local-smoke-key'
          export DASHBOARD_USER='gn'
          export DASHBOARD_PASSWORD='local-smoke-password'
          export PORT='3100'
          node src/start.js >/tmp/gn-server.log 2>&1 &
          pid=$!
          cleanup(){ kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for i in {1..20}; do
            if curl -fsS --max-time 2 http://127.0.0.1:3100/health > /tmp/health.json; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then cat /tmp/gn-server.log; exit 1; fi
          grep -q '"ok":true' /tmp/health.json
          curl -fsS --max-time 3 http://127.0.0.1:3100/login > /tmp/login.html
          grep -q 'GN PIVOT' /tmp/login.html
          grep -q '로그인' /tmp/login.html

  live-render-diagnostic:
    needs: dashboard-safety
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - name: Find live Render dashboard host
        shell: bash
        run: |
          set -u
          hosts=(
            gn-rotation-dashboard.onrender.com
            gn-rotation-cloud.onrender.com
            gn-pivot.onrender.com
            gn-pivot-dashboard.onrender.com
            gn-rotation-cloud-v4-clean.onrender.com
            gn-rotation.onrender.com
          )
          found=''
          for host in "${hosts[@]}"; do
            code=$(curl -L -sS -o /tmp/health -w '%{http_code}' --connect-timeout 5 --max-time 10 "https://$host/health" || true)
            body=$(cat /tmp/health 2>/dev/null || true)
            echo "PROBE $host => $code $body"
            if [ "$code" = '200' ] && printf '%s' "$body" | grep -q '"ok"'; then found="$host"; break; fi
          done
          test -n "$found"
          echo "LIVE_RENDER_HOST=$found"
          curl -L -fsS --max-time 10 "https://$found/login" -o /tmp/login
          grep -q 'GN PIVOT' /tmp/login
          grep -q '로그인' /tmp/login

  legacy-regression-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test