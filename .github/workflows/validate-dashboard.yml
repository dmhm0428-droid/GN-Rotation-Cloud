name: Validate dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node --check src/start.js
      - run: node --check src/dashboard-ui-health-v1.js
      - run: node --check src/dashboard-big-picture-v1.js
      - run: node --check src/dashboard-rotation-v1.js
      - run: node --check src/dashboard-etf-api-v1.js
      - run: node --check src/precursor-dashboard.js
      - run: node --check src/dashboard-precursor-top3-v1.js
      - run: node --check src/dashboard-resilience-patch.js
      - run: node --check src/dashboard-hard-rescue.js
      - run: node --check src/dashboard-authoritative-v1.js
      - run: node --check src/dashboard-live-summary-patch.js
      - run: node --test test/dashboard-resilience.test.js test/dashboard-injected-script.test.js
      - name: Verify Render build configuration
        run: |
          grep -q 'buildCommand: npm install --omit=dev' render.yaml
          grep -q 'healthCheckPath: /health/ui' render.yaml
      - name: Boot server and verify authenticated canonical dashboard shell
        shell: bash
        run: |
          set -uo pipefail
          export SUPABASE_URL='http://127.0.0.1:9'
          export SUPABASE_SERVICE_ROLE_KEY='local-smoke-key'
          export DASHBOARD_USER='gn'
          export DASHBOARD_PASSWORD='local-smoke-password'
          export PORT='3100'
          node src/start.js >/tmp/gn-server.log 2>&1 &
          pid=$!
          cleanup(){ kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:3100/health/ui > /tmp/ui-health.json; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then echo 'GN server exited during startup'; cat /tmp/gn-server.log; exit 1; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then echo 'GN UI health did not become ready'; cat /tmp/gn-server.log; exit 1; fi
          grep -q '"ok":true' /tmp/ui-health.json || exit 1
          grep -q 'GN_UI_CANONICAL_20260905_V3' /tmp/ui-health.json || exit 1
          grep -q '"canonicalDashboardOwner":"dashboard-authoritative-v1"' /tmp/ui-health.json || exit 1
          grep -q '"partialLoaderDisabled":true' /tmp/ui-health.json || exit 1
          curl -fsS --max-time 3 http://127.0.0.1:3100/login > /tmp/login.html || { cat /tmp/gn-server.log; exit 1; }
          grep -q 'GN PIVOT' /tmp/login.html || exit 1
          grep -q '로그인' /tmp/login.html || exit 1
          curl -fsS -c /tmp/cookies -b /tmp/cookies -X POST \
            -d 'username=gn&password=local-smoke-password' \
            -o /tmp/post-login -D /tmp/post-login-headers \
            http://127.0.0.1:3100/login || { cat /tmp/gn-server.log; exit 1; }
          curl -fsS -c /tmp/cookies -b /tmp/cookies http://127.0.0.1:3100/ > /tmp/dashboard.html || { cat /tmp/gn-server.log; exit 1; }
          grep -q 'id="decision"' /tmp/dashboard.html || { echo 'decision missing'; exit 1; }
          grep -q 'id="leaders"' /tmp/dashboard.html || { echo 'leaders missing'; exit 1; }
          grep -q 'id="top3"' /tmp/dashboard.html || { echo 'top3 missing'; exit 1; }
          grep -q 'id="retirementEtf"' /tmp/dashboard.html || { echo 'retirementEtf missing'; exit 1; }
          grep -q 'id="portfolio"' /tmp/dashboard.html || { echo 'portfolio missing'; exit 1; }
          grep -q 'gn-authoritative-v4' /tmp/dashboard.html || { echo 'authoritative dashboard renderer missing'; exit 1; }
          if grep -q 'gn-final-style-v3' /tmp/dashboard.html; then echo 'conflicting final full-body renderer unexpectedly active'; exit 1; fi
          if grep -q 'gn-partial-loading-v1' /tmp/dashboard.html; then echo 'broken partial loader unexpectedly active'; exit 1; fi
          grep -q 'gn-leading-top3-v2-ui' /tmp/dashboard.html || { echo 'single TOP3 renderer missing'; exit 1; }

  legacy-regression-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test

  live-render-diagnostic:
    needs: [dashboard-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RENDER_PUBLIC_URL: ${{ vars.RENDER_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe live Render canonical UI chain without blocking deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="${RENDER_PUBLIC_URL%/}"
          if [ -z "$base" ]; then
            base="https://gn-rotation-cloud-8b0z.onrender.com"
            echo "RENDER_PUBLIC_URL missing; using verified live service URL $base"
          fi
          ui_code="$(curl -L -sS -o /tmp/ui-health -w '%{http_code}' --connect-timeout 5 --max-time 12 "$base/health/ui" || true)"
          health_code="$(curl -L -sS -o /tmp/health -w '%{http_code}' --connect-timeout 5 --max-time 12 "$base/health" || true)"
          login_code="$(curl -L -sS -o /tmp/login -w '%{http_code}' --connect-timeout 5 --max-time 12 "$base/login" || true)"
          echo "LIVE_CODES ui=$ui_code health=$health_code login=$login_code"
          if [ "$ui_code" = "200" ] && grep -q '"ok":true' /tmp/ui-health && grep -q 'GN_UI_CANONICAL_20260905_V3' /tmp/ui-health; then
            grep -q 'GN PIVOT' /tmp/login
            echo "LIVE_RENDER_UI_OK=$base"
            exit 0
          fi
          echo "::warning::Render is reachable but not yet serving the new canonical revision."
          exit 1
