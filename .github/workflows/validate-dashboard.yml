name: Validate dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node --check src/start.js
      - run: node --check src/dashboard-scalp-failopen-v1.js
      - run: node --check src/dashboard-big-picture-v1.js
      - run: node --check src/precursor-dashboard.js
      - run: node --check src/dashboard-precursor-top3-v1.js
      - run: node --check src/dashboard-resilience-patch.js
      - run: node --check src/dashboard-hard-rescue.js
      - run: node --check src/final-dashboard-patch.js
      - run: node --test test/dashboard-resilience.test.js
      - name: Verify Render build configuration
        run: |
          grep -q 'buildCommand: npm install --omit=dev' render.yaml
          grep -q 'healthCheckPath: /health' render.yaml
      - name: Boot server and verify authenticated dashboard shell
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_URL='http://127.0.0.1:9'
          export SUPABASE_SERVICE_ROLE_KEY='local-smoke-key'
          export DASHBOARD_USER='gn'
          export DASHBOARD_PASSWORD='local-smoke-password'
          export PORT='3100'
          node src/start.js >/tmp/gn-server.log 2>&1 &
          pid=$!
          cleanup(){ kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for i in {1..20}; do
            if curl -fsS --max-time 2 http://127.0.0.1:3100/health > /tmp/health.json; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then cat /tmp/gn-server.log; exit 1; fi
          grep -q '"ok":true' /tmp/health.json
          curl -fsS --max-time 3 http://127.0.0.1:3100/login > /tmp/login.html
          grep -q 'GN PIVOT' /tmp/login.html
          grep -q '로그인' /tmp/login.html
          curl -fsS -c /tmp/cookies -b /tmp/cookies -X POST \
            -d 'username=gn&password=local-smoke-password' \
            -o /tmp/post-login -D /tmp/post-login-headers \
            http://127.0.0.1:3100/login
          curl -fsS -c /tmp/cookies -b /tmp/cookies http://127.0.0.1:3100/ > /tmp/dashboard.html
          grep -q 'id="hero"' /tmp/dashboard.html
          grep -q 'id="majors"' /tmp/dashboard.html
          grep -q 'id="top3"' /tmp/dashboard.html
          grep -q 'gn-scalp-failopen-v1' /tmp/dashboard.html

  legacy-regression-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test

  live-render-diagnostic:
    # Live deployment health must still be checked when unrelated legacy strategy tests fail.
    needs: [dashboard-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RENDER_PUBLIC_URL: ${{ vars.RENDER_PUBLIC_URL }}
    steps:
      - name: Verify configured live Render dashboard
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDER_PUBLIC_URL:-}" ]; then
            echo "RENDER_PUBLIC_URL repository variable is not configured; live-host probe skipped without guessing hostnames."
            exit 0
          fi
          base="${RENDER_PUBLIC_URL%/}"
          case "$base" in
            https://*.onrender.com|https://*) ;;
            *) echo "RENDER_PUBLIC_URL must be an https URL"; exit 1;;
          esac
          curl -L -fsS --connect-timeout 5 --max-time 20 "$base/health" -o /tmp/health
          grep -q '"ok"' /tmp/health
          curl -L -fsS --connect-timeout 5 --max-time 20 "$base/login" -o /tmp/login
          grep -q 'GN PIVOT' /tmp/login
          grep -q '로그인' /tmp/login
          echo "LIVE_RENDER_OK=$base"
