name: Validate precursor branch

on:
  push:
    branches: [fix/precursor-top3-ui]

jobs:
  precursor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node --check src/precursor-dashboard.js
      - run: node --check src/dashboard-precursor-top3-v1.js
      - run: node --check src/start.js
      - run: node --test test/precursor-dashboard.test.js test/pre-pump-dashboard.test.js
